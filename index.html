<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#0F1419">
<title>Maison</title>
<style>
  :root {
    --bg: #0F1419;
    --card: #1A2129;
    --text: #E8ECEF;
    --muted: #9AA7B2;
    --line: #2E3A45;
    --accent: #F5B544;
    --heat: #FF9B6A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }
  header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin: 0; font-size: 15px; color: var(--muted); }
  section { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 10px; }
  a.btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; padding: 0 12px; border-radius: 16px;
    border: 1px solid var(--line); color: var(--text); background: transparent;
    font-size: 16px; font-weight: 700; text-decoration: none; text-align: center;
  }
  a.btn:active { transform: scale(0.97); opacity: 0.85; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #1A1405; }
  a.btn.heat { background: var(--heat); border-color: var(--heat); color: #1A0D05; }
  a.btn svg { flex: none; }
  a.btn.big { flex-direction: column; gap: 2px; min-height: 72px; font-size: 20px; }
  a.btn.big .sous { font-size: 13px; font-weight: 600; opacity: 0.75; }
  a.btn.refresh { flex: none; width: 56px; min-height: 72px; padding: 0; }
  .note { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.4; }
  .etat { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); font-size: 15px; font-weight: 600; line-height: 1.4; }
</style>
</head>
<body>

<header>
  <h1>Salon</h1>
  <p>Volet et chauffage</p>
</header>

<section aria-labelledby="t-volet">
  <h2 id="t-volet">Volet</h2>
  <div class="row">
    <a id="btn-volet" class="btn primary big" href="shortcuts://run-shortcut?name=Volet%20salon">
      <span id="volet-titre">Volet salon</span>
      <span id="volet-sous" class="sous">Toucher pour ouvrir ou fermer</span>
    </a>
    <a class="btn refresh" aria-label="Actualiser l’état du volet" href="shortcuts://run-shortcut?name=%C3%89tat%20volet%20salon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </a>
  </div>
</section>

<section aria-labelledby="t-chauffage">
  <h2 id="t-chauffage">Chauffage</h2>
  <div class="row">
    <a class="btn heat" href="shortcuts://run-shortcut?name=Chauffage%2021">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>
      21 °C
    </a>
    <a class="btn" href="shortcuts://run-shortcut?name=Chauffage%20arr%C3%AAt">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>
      Arrêt
    </a>
  </div>
  <div class="row">
    <a class="btn" href="shortcuts://run-shortcut?name=Chauffage%20%C3%A9tat">Voir l’état</a>
  </div>
  <p id="etat" class="etat" hidden></p>
  <p class="note">Chaque bouton lance un raccourci de l’app Raccourcis. La première fois, iOS demande de confirmer l’ouverture.</p>
</section>

<script>
  // Après l'exécution d'un raccourci, Raccourcis rouvre automatiquement cette page.
  (function () {
    var back = encodeURIComponent(location.origin + location.pathname);
    document.querySelectorAll('a[href^="shortcuts://run-shortcut"]').forEach(function (a) {
      a.href = a.getAttribute('href').replace('shortcuts://run-shortcut', 'shortcuts://x-callback-url/run-shortcut')
        + '&x-success=' + back + '&x-cancel=' + back + '&x-error=' + back;
    });
  })();
</script>
<script>
  // Affiche l'état du volet et du chauffage renvoyés par les raccourcis « État volet salon » et « Chauffage état ».
  (function () {
    var modes = { '0': 'Auto', '1': 'Auto', '2': 'Déshumidification', '3': 'Froid', '4': 'Chauffage', '6': 'Ventilation', '7': 'Auto' };

    function showVolet(n, when) {
      var t = document.getElementById('volet-titre');
      var s = document.getElementById('volet-sous');
      if (!t || !s) return;
      var ouvert = n >= 50;
      t.textContent = n >= 99 ? 'Volet ouvert' : n <= 1 ? 'Volet fermé' : 'Volet ouvert à ' + Math.round(n) + ' %';
      s.textContent = 'Toucher pour ' + (ouvert ? 'fermer' : 'ouvrir') + (when ? ' · lu à ' + when : '');
    }
    function show(id, txt, when) {
      var el = document.getElementById(id);
      if (!el) return;
      el.hidden = false;
      el.textContent = txt + (when ? ' · lu à ' + when : '');
    }
    function save(key, txt, when) {
      try { localStorage.setItem(key, JSON.stringify({ txt: txt, when: when })); } catch (e) {}
    }
    function restore(key, id) {
      try {
        var s = JSON.parse(localStorage.getItem(key));
        if (s) show(id, s.txt, s.when);
      } catch (e) {}
    }

    // On réaffiche d'abord les derniers états connus.
    try {
      var sv = JSON.parse(localStorage.getItem('etatVolet'));
      if (sv && typeof sv.n === 'number') showVolet(sv.n, sv.when);
    } catch (e) {}
    restore('etat', 'etat');

    var raw = new URLSearchParams(location.search).get('result');
    if (!raw) return;
    raw = raw.trim();
    var when = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    if (/^-?\d+([.,]\d+)?$/.test(raw)) {
      // Résultat du volet : position actuelle (100 = ouvert, 0 = fermé).
      var n = parseFloat(raw.replace(',', '.'));
      try { localStorage.setItem('etatVolet', JSON.stringify({ n: n, when: when })); } catch (e) {}
      showVolet(n, when);
    } else {
      // Résultat du chauffage : texte du Daikin (ret=OK,pow=...,mode=...,stemp=...).
      var d = {};
      raw.split(',').forEach(function (kv) {
        var i = kv.indexOf('=');
        if (i > 0) d[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();
      });
      if (d.ret === 'OK') {
        var txtC = d.pow === '1'
          ? 'En marche · ' + (modes[d.mode] || 'Mode ' + d.mode) + ' · consigne ' + d.stemp + ' °C'
          : 'À l’arrêt · dernière consigne ' + d.stemp + ' °C';
        save('etat', txtC, when);
        show('etat', txtC, when);
      } else {
        show('etat', 'Réponse inattendue : ' + raw.slice(0, 80));
      }
    }
    history.replaceState(null, '', location.pathname);
  })();
</script>
</body>
</html>
